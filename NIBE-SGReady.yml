# NIBE SG Ready + AUX board
#
# Initially I had a joined pump PWM drive and SG Ready device, but now 
# SG Ready is kept on its own device, separate from the
# pump drive, so a pump-side bug or reboot can never move the SG contacts.
# Also it means the board can live inside the NIBE SMO S40, without any wires outside
# and importantly, without any wires that are also connected to 230V devices.
#
# SG Ready contacts, ON = contact closed (official levels):
#   Blocked (1,0)  Normal (0,0)  Enhanced (0,1)  Surplus (1,1)
#
# Additional AUX switch functions are to be determined what is useful. For now I take
# "More hot water" and "Away mode", but they are also on the RMU40 thermostat
# Maybe replace later with "Allow cooling". I just seemed a waste not to add 
# a few option switches.
#
# "SG Ready mode" select:
#   Auto      1. HA Surplus switch ON -> Surplus
#             2. else Day cycle: Enhanced inside the two usually low price windows, Normal outside
#             3. Day cycle off or time not valid yet -> Normal
#   for all other modes (Normal / Blocked / Enhanced / Surplus)
#             1. Manual override, forced. The HA Surplus switch and Day cycle are both ignored.
#
# HA Surplus: HA must turn it ON again at least every 10 minutes, else it
# drops itself after ${surplus_timeout}. It is not restored after a reboot.
# It is to be expected HA will switch this on during the occasional winter sun, 
# usually between 10:00-16:00 on the rare sunny days, but that logic is at HA logic, not here.
#
# "Current mode" text sensor shows what the contacts are really set to.
#
# Day cycle windows (hidden config, defaults): Enhanced 22:00-06:30 and
# 09:30-17:00 default, but settable. Code exist to handle midnight transition inside a window.
# The timer is on a minute interval, so is unlike to happen exactly at the 00 second mark.
#
# Everything defaults to the safe state at boot: contacts (0,0) = Normal.
# Built with ESPHome 2026.7.2, ESP12F (esp12e).

substitutions:
  devicename: nibe-sgready
  shortid: SGR
  description: NIBE SG Ready and AUX control.
  prj_version: "2026.10.22.5"

  # Pins, same as the reused NIBE print
  # Most pins likely also need 'inverted' as a FET drives open state on high
  GPIO_Status_LED: GPIO1    # shares UART TX, so logger baud_rate is 0
  GPIO_sg_ready_a: GPIO12   # Aux1
  GPIO_sg_ready_b: GPIO13   # Aux2
  GPIO_hot_water:  GPIO15   # Aux3, boots LOW: fine, default is off
  GPIO_away_mode:  GPIO4    # Aux4

  # HA keep-alive is every 5 minutes, one missed beat is tolerated
  surplus_timeout: 15minutes

  # NTP server on the local network, probably the gateway. Set your IP.
  ntp_gateway: 192.168.19.1
  ntp_timezone: Europe/Amsterdam


esphome:
  name: ${devicename}
  comment: ${description} v${prj_version}
  on_boot:
    priority: -100
    then:
      - script.execute: sg_update

esp8266:
  board: esp12e
  restore_from_flash: true

# baud_rate 0: GPIO1 is used for the LED, not for logging
logger:
  level: WARN
  baud_rate: 0

# This device works without HA, so no reboot needed on loss of HA
# Note that missing WiFi will still cause an occasional reboot
api:
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Works lost connectivity, so rarely reboot.
  # That is to say, we need to connect briefly to sync time-of-day clock,
  # and we do want to be able to connect to the WebUI, but no need
  # to reboot every 10 minutes.
  reboot_timeout: 24hours
  ap:
    ssid: "${devicename} fallback hotspot"
    # Open on purpose: easier recovery

captive_portal:

# Note: v3 loads its JS from oi.esphome.io, so the WebUI would need internet.
# unless if we force local at 100KB cost. remove when running on a 1MB flash device
web_server:
  port: 80
  version: 3
  local: true


time:
  # Two sources, both set the same system clock, so time is valid after a
  # reboot even if HA is not up yet (or the gateway has no NTP).
  # The lambdas use ha_time.now(), which reads that shared clock.
  # Local network only: HA needs no internet, the gateway NTP neither.
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: sg_update

  - platform: sntp
    id: ntp_time
    timezone: ${ntp_timezone}
    servers:
      - ${ntp_gateway}      # slot 0: hardcoded local network NTP
      - 0.pool.ntp.org      # slot 1: needs internet, harmless without
    on_time_sync:
      - script.execute: sg_update


globals:
  # What the contacts should be: 0 Normal, 1 Enhanced, 2 Blocked, 3 Surplus
  - id: sg_target
    type: int
    initial_value: '0'
  # What the contacts were last set to. -1 = not yet set since boot.
  - id: sg_applied
    type: int
    initial_value: '-1'


light:
  # Visual watchdog, blinked from the interval below
  - platform: status_led
    name: "${shortid} Led"
    id: led_output
    pin: ${GPIO_Status_LED}
    restore_mode: ALWAYS_OFF
    internal: true


switch:
  # SG Ready contacts, hidden: only the script may set them.
  # Use "inverted: true" inside pin if a FET output stage inverts
  - platform: gpio
    pin: ${GPIO_sg_ready_a}
    id: aux1
    internal: true
    inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: ${GPIO_sg_ready_b}
    id: aux2
    internal: true
    inverted: true
    restore_mode: ALWAYS_OFF

  # AUX functions. Default off after reboot, the safe state.
  - platform: gpio
    pin: ${GPIO_hot_water}
    name: "${shortid} More hot water"
    id: aux_hot_water
    icon: mdi:water
    inverted: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_weight: 120
  - platform: gpio
    pin: ${GPIO_away_mode}
    name: "${shortid} Away mode"
    id: aux_away_mode
    icon: mdi:home-export-outline
    inverted: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_weight: 130

  # HA surplus request. Only has effect while the select is Auto.
  # instead of on_value, we use turn_on_action as it runs on every command,
  # so it is triggered by the HA keep-alive and restarts the timeout.
  - platform: template
    name: "${shortid} Solar Surplus"
    id: solar_surplus
    icon: mdi:solar-power
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: surplus_timeout
    on_turn_on:
      - script.execute: sg_update
    on_turn_off:
      - script.execute: sg_update
    web_server:
      sorting_weight: 140

  # Day cycle on/off. When active, cycle through the commonly low price windows
  # even without HA or internet. No need for a complex, error prone, per hour 
  # price check. Its always "avoid morning peak and evening peak" anwyway
  - platform: template
    name: "${shortid} Day cycle"
    id: day_cycle
    icon: mdi:recycle-variant
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: sg_update
    on_turn_off:
      - script.execute: sg_update
    web_server:
      sorting_weight: 210


select:
  # The SG Ready control. Restored, so a reboot keeps the last mode
  # (except Surplus, see on_boot).
  - platform: template
    name: "${shortid} SG Ready override"
    id: nibe_sg_ready
    icon: mdi:currency-usd
    optimistic: true
    restore_value: true
    options:
      - Auto
      - Normal
      - Blocked
      - Enhanced
      - Surplus
    initial_option: Auto
    entity_category: config
    web_server:
      sorting_weight: 205
    on_value:
      then:
        - script.execute: sg_update

datetime:
  # Day cycle time points. Hidden config, picked up by the 1 minute check.
  # Rather then avoid windows, we make use-these windows. One night window
  # from 22h00-06h30 and one day window from 09h30 to 17h00, but changeable
  - platform: template
    type: time
    name: "${shortid} Night start"
    id: dc_start1
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
    web_server:
      sorting_weight: 220

  - platform: template
    type: time
    name: "${shortid} Night stop"
    id: dc_stop1
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "06:30:00"
    web_server:
      sorting_weight: 230

  - platform: template
    type: time
    name: "${shortid} Day start"
    id: dc_start2
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "09:30:00"
    web_server:
      sorting_weight: 240

  - platform: template
    type: time
    name: "${shortid} Day stop"
    id: dc_stop2
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "17:00:00"
    web_server:
      sorting_weight: 250


script:
  # Surplus keep-alive watchdog. Restarted by every HA Surplus command.
  - id: surplus_timeout
    mode: restart
    then:
      - delay: ${surplus_timeout}
      - switch.turn_off: solar_surplus

  # Decide the SG Ready mode, and move the contacts only when it actually changed.
  # Called on select change, day cycle change, time sync, boot and every
  # minute (so the day cycle and its time points are picked up).
  - id: sg_update
    mode: restart
    then:
      - lambda: |-
          auto mode = id(nibe_sg_ready).current_option();
 
          int target = 0; // "Normal"
          if (mode == "Enhanced") {
            target = 1;
          } else if (mode == "Blocked") {
            target = 2;
          } else if (mode == "Surplus") {
            target = 3;
          } else if (mode == "Auto") {
            if (id(solar_surplus).state) {
              target = 3;                         // HA surplus request
            } else {
              // Day cycle: only with the switch on and a synced clock
              auto t = id(ha_time).now();
              if (id(day_cycle).state && t.is_valid()) {
                int m  = t.hour * 60 + t.minute;
                int s1 = id(dc_start1).hour * 60 + id(dc_start1).minute;
                int e1 = id(dc_stop1).hour  * 60 + id(dc_stop1).minute;
                int s2 = id(dc_start2).hour * 60 + id(dc_start2).minute;
                int e2 = id(dc_stop2).hour  * 60 + id(dc_stop2).minute;
                
                // Is minute m inside the window s..e? (s = start, e = stop)
                // e before s means the window crosses midnight.
                auto in_window = [](int m, int s, int e) -> bool {
                  if (e >= s) {
                    return (m >= s) && (m < e);
                  }
                  return (m >= s) || (m < e);
                };

                // Well, is it in either of the windows?
                bool window1 = in_window(m, s1, e1);
                bool window2 = in_window(m, s2, e2);
                if (window1 || window2) {
                  target = 1;                     // Enhanced
                }
              }
            }
          }
          id(sg_target) = target;
      - if:
          condition:
            lambda: 'return id(sg_target) != id(sg_applied);'
          then:
            # Order of the two switches per target is deliberate:
            # diagonal moves pass through Normal or Enhanced, never through
            # Blocked. Blocked stops the heat pump, so it must never flash by.
            - if:
                condition:
                  lambda: 'return id(sg_target) == 0;'
                then:
                  - switch.turn_off: aux1     # from Surplus: via Enhanced
                  - switch.turn_off: aux2
            - if:
                condition:
                  lambda: 'return id(sg_target) == 3;'
                then:
                  - switch.turn_on: aux2      # from Normal: via Enhanced
                  - switch.turn_on: aux1
            - if:
                condition:
                  lambda: 'return id(sg_target) == 2;'
                then:
                  - switch.turn_off: aux2     # from Enhanced: via Normal
                  - switch.turn_on: aux1
            - if:
                condition:
                  lambda: 'return id(sg_target) == 1;'
                then:
                  - switch.turn_off: aux1     # from Blocked: via Normal
                  - switch.turn_on: aux2
            - lambda: 'id(sg_applied) = id(sg_target);'
            - text_sensor.template.publish:
                id: sg_actual
                state: !lambda |-
                  static const char *names[] = {"Normal", "Enhanced", "Blocked", "Surplus"};
                  return std::string(names[id(sg_target)]);

interval:
  # Every 10 seconds blink the LED for 0.1 s: visual "still running"
  - interval: 10seconds
    then:
      - light.toggle: led_output
      - delay: 0.1s
      - light.toggle: led_output

  # Every minute re-evaluate the day cycle (also catches changed time points)
  - interval: 1min
    then:
      - script.execute: sg_update


button:
  - platform: restart
    name: "_Restart"
    disabled_by_default: true
    entity_category: diagnostic

  - platform: factory_reset
    name: "_Restart Factory Default"
    disabled_by_default: true
    entity_category: diagnostic


sensor:
  - platform: uptime
    name: "_Uptime"
    disabled_by_default: true
    entity_category: diagnostic

  - platform: wifi_signal
    name: "_Wi-Fi Signal"
    update_interval: 60s
    disabled_by_default: true
    entity_category: diagnostic


text_sensor:
# What the contacts are actually set to, whatever the reason
  - platform: template
    name: "${shortid} Current mode"
    id: sg_actual
    icon: mdi:information-outline
    update_interval: never
    web_server:
      sorting_weight: 110

  - platform: wifi_info
    ip_address:
      name: "_IP Address"
      disabled_by_default: true
    ssid:
      name: "_Wi-Fi SSID"
      disabled_by_default: true
    bssid:
      name: "_Wi-Fi BSSID"
      disabled_by_default: true

  - platform: version
    name: "_ESPHome Version"
    hide_timestamp: true
    disabled_by_default: true
    entity_category: diagnostic


# END OF CONFIGURATION   name: nibe-sgready.yaml
